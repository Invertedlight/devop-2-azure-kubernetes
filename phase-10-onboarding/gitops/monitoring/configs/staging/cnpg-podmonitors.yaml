apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: customer1-db
  namespace: customer1
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: customer1-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: julius-db
  namespace: julius
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: julius-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
