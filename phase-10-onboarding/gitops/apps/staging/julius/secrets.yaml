apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: julius-secrets
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "ab0c14b9-8da1-41e8-b735-61cf562e56cf"
    keyvaultName: "kv-mercury-stg-qtqi6p"
    tenantId: "56064b81-ec30-4395-bb27-af9877c941dc"
    objects: |
      array:
        - |
          objectName: julius-db-user
          objectType: secret
        - |
          objectName: julius-db-password
          objectType: secret
        - |
          objectName: storage-account-name
          objectType: secret
        - |
          objectName: julius-blob-sas
          objectType: secret
        - |
          objectName: julius-telegram-bot-token
          objectType: secret
        - |
          objectName: julius-telegram-chat-id
          objectType: secret
  secretObjects:
    - secretName: julius-db-credentials
      type: kubernetes.io/basic-auth
      data:
        - objectName: julius-db-user
          key: username
        - objectName: julius-db-password
          key: password
    - secretName: julius-n8n-env
      type: Opaque
      data:
        - objectName: julius-db-user
          key: DB_POSTGRESDB_USER
        - objectName: julius-db-password
          key: DB_POSTGRESDB_PASSWORD
    - secretName: julius-backup-creds
      type: Opaque
      data:
        - objectName: storage-account-name
          key: storage-account-name
        - objectName: julius-blob-sas
          key: julius-blob-sas
    - secretName: julius-telegram-creds
      type: Opaque
      data:
        - objectName: julius-telegram-bot-token
          key: TELEGRAM_BOT_TOKEN
        - objectName: julius-telegram-chat-id
          key: TELEGRAM_CHAT_ID
