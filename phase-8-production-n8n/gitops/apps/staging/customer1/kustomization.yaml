apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/customer1/
patches:
  - target:
      kind: SecretProviderClass
      name: customer1-secrets
    patch: |-
      - op: replace
        path: /spec/parameters/userAssignedIdentityID
        value: "ab0c14b9-8da1-41e8-b735-61cf562e56cf" # TODO: update from phase-7 terraform output aks_keyvault_secrets_provider_client_id after apply
      - op: replace
        path: /spec/parameters/tenantId
        value: "56064b81-ec30-4395-bb27-af9877c941dc"
  - target:
      kind: ObjectStore
      name: customer1-objectstore
    patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: "https://mercurybackupsjrich.blob.core.windows.net/customer1"
  - target:
      kind: Ingress
      name: customer1-ingress
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: "customer1-mercury.jameshomelab.org"
      - op: replace
        path: /spec/rules/0/host
        value: "customer1-mercury.jameshomelab.org"
